name: Public source safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without retaining a write credential
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend test dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Audit the public snapshot
        run: python scripts/public_release_audit.py
      - name: Lint Python source
        run: python -m ruff check backend/app backend/tests scripts/public_release_audit.py
      - name: Scan Python source for common security mistakes
        run: python -m bandit -q -r backend/app
      - name: Audit installed Python dependencies
        run: python -m pip_audit
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without retaining a write credential
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build the production frontend
        working-directory: frontend
        run: npm run build
