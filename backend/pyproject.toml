[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-katy-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "openai>=2.8",
    "pypdf>=7.1.1",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.9",
    "httpx>=0.28",
    "pip-audit>=2.10",
    "pytest>=8",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["private_content*", "tests*"]
